# Runs the unittest suite on every pull request to main and every push to main.
# The tests are mocked: no .env and no network are needed.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
